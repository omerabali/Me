# Render Blueprint — yalnızca backend API
# Frontend: Vercel (+ custom domain)
# Secret env'leri Dashboard'dan doldur (ALLOWED_ORIGINS = Vercel domain)

services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8080"
      - key: GITHUB_OWNER
        value: omerabali
      - key: GITHUB_AUTO_SYNC
        value: "false"
      # Örnek: https://senin-domain.com,https://xxx.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD_SALT
        sync: false
      - key: ADMIN_PASSWORD_SHA256
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false

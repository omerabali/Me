<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <style>
    :root {
      --bg: #09090b;
      --border: #27272a;
      --text: #ffffff;
      --accent: #8b5cf6;
      --subtle-glow: rgba(139, 92, 246, 0.25);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: #e4e4e7;
        --text: #09090b;
        --accent: #6366f1;
        --subtle-glow: rgba(99, 102, 241, 0.15);
      }
    }
    .bg-card { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .mono-char { fill: var(--text); }
    .stroke-elem { stroke: var(--text); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .stroke-bar { stroke: var(--text); stroke-width: 4.5; stroke-linecap: round; }
    .accent-point { fill: url(#accent-gradient); }
    .glow-circle { fill: var(--accent); opacity: 0.2; }
  </style>

  <!-- Arka Plan Kartı (Koyu / Açık Mod Otomatik Uyumlu) -->
  <rect x="1" y="1" width="62" height="62" rx="16" class="bg-card" />

  <!-- Sağ Üst Hafif Ambiyans Işığı -->
  <circle cx="50" cy="14" r="9" class="glow-circle" />

  <!-- Ö Harfi: İki Vektör Nokta + Kusursuz Geometrik O Gövdesi -->
  <circle cx="20" cy="18" r="2.2" class="mono-char" />
  <circle cx="28" cy="18" r="2.2" class="mono-char" />
  <rect x="14" y="24" width="20" height="26" rx="9" class="stroke-elem" />

  <!-- A Harfi: Dinamik Açılı Bacaklar + Yatay Çizgi -->
  <path d="M37 50 L44.5 24 L52 50" class="stroke-elem" />
  <path d="M39.5 41 L49.5 41" class="stroke-bar" />

  <!-- Sağ Üst Tech Pulse / Akıllı Vurgu Noktası -->
  <circle cx="50" cy="14" r="3.2" class="accent-point" />
</svg>